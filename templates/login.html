{% extends "base.html" %}

{% block title %}Sign In — Agri Smart AI{% endblock %}

{% block auth_content %}
<div class="auth-header">
    <div class="auth-logo">🌾 AgriSmart<span>AI</span></div>
    <p class="auth-subtitle">Sign in to access your agricultural dashboard & AI tools</p>
</div>

<form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
    <div class="form-group">
        <label class="form-label" for="login_id">Username or Email Address</label>
        <input 
            type="text" 
            id="login_id" 
            name="login_id" 
            class="form-control" 
            placeholder="farmer@agri.com or username" 
            value="{{ login_id or '' }}" 
            required 
            autofocus
        >
    </div>

    <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="Enter your password" 
            required
        >
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
        🔐 Sign In to Dashboard
    </button>
</form>

<div style="text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--text-secondary);">
    Don't have an account? 
    <a href="{{ url_for('register') }}" style="font-weight: 600;">Create Account</a>
</div>
{% endblock %}
